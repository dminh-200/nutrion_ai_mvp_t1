forbidden_output:
  keywords:
    - "chua khoi"
    - "chua dut diem"
    - "khoi han"
    - "cam ket khoi"
    - "dam bao khoi benh"
    - "thay the thuoc"
    - "ngung uong thuoc"
    - "ngung tiem insulin"
    - "tu bo phac do"
  regex_patterns:
    - '(?i)\b(metformin|insulin|glibenclamide|glimepiride|losartan|amlodipine|allopurinol|febuxostat|colchicine|atorvastatin|statin)\b[^.\n]*\b\d+\s*(mg|mcg|iu|ui|ml|vien)\b'
    - '(?i)\b\d+\s*(mg|mcg|iu|ui|ml)\s*(metformin|insulin|losartan|amlodipine|allopurinol|colchicine|thuoc)\b'
    - '(?i)\b(uong|tiem|dung|tang|giam|chia)\s+(lieu\s+)?\d+\s*(mg|mcg|iu|ui|ml|vien)\b'
    - '(?i)\b(toi|he\s*thong)\s+chan\s+doan\s+(ban|quy\s*vi)\b'
    - '(?i)\bchan\s+doan\s+(xac\s*dinh|mac\s+benh|chinh\s*xac)\b'
    - '(?i)\b(cam\s*ket|dam\s*bao|chac\s*chan)\s+(chua\s+)?(khoi|het\s+benh)\b'
