version: 1

disclaimer_vi: >
  *Lưu ý: Thực đơn chỉ mang tính tham khảo hỗ trợ dinh dưỡng, không thay thế chẩn đoán hoặc chỉ định điều trị của bác sĩ.*

bmi_bounds:
  min: 10.0
  max: 80.0

injection:
  keywords:
    # Tiếng Việt có dấu & không dấu (được chuẩn hóa unidecode + lowercase)
    - "bo qua huong dan"
    - "bo qua moi huong dan"
    - "bo qua tat ca huong dan"
    - "bo qua quy tac"
    - "bo qua rang buoc"
    - "quen het huong dan"
    - "quen tat ca chi dan"
    - "quen vai tro cu"
    - "ban la admin"
    - "ban la quan tri vien"
    - "tro thanh quan tri"
    - "tiet lo prompt"
    - "tiet lo system prompt"
    - "in ra prompt"
    - "hien thi prompt"
    - "hien thi lenh he thong"
    - "xem cau hinh he thong"
    - "vo hieu hoa an toan"
    - "tat kiem tra an toan"
    - "vuot rao an toan"
    - "khong can tuan theo quy tac"
    # Tiếng Anh
    - "ignore previous"
    - "ignore all previous"
    - "ignore all instructions"
    - "disregard previous"
    - "disregard all rules"
    - "forget your instructions"
    - "override instructions"
    - "system prompt"
    - "developer prompt"
    - "reveal your prompt"
    - "show your prompt"
    - "print system message"
    - "you are now admin"
    - "act as root"
    - "jailbreak"
    - "developer mode"
    - "dan mode"
    - "bypass safety"
    - "override safety"
    # Biến thể lỗi chính tả cố ý / leetspeak
    - "bo qa huong dan"
    - "bo qua chi dan truoc"
    - "ignore prevous"
    - "ignre previous"
    - "systm prompt"
    - "systemprompt"
    - "tiet lo promp"
    - "devloper mode"
    - "bypas safety"
  regex_patterns:
    - '(?i)ignore\s+(all\s+)?(prev\w*|above|prior)\s*(instruct\w*|prompt\w*|rule\w*)?'
    - '(?i)disregard\s+(all\s+)?(prev\w*|prior|system)\s*(instruct\w*|rule\w*|prompt\w*)?'
    - '(?i)(bo|quen|xoa|huy)\s+q?u?a?\s*(moi|het|tat\s*ca)?\s*(huong|chi|quy)\s*(dan|tac)'
    - '(?i)(tiet|lo|in|xem|hien\s*thi|doc)\s*(ra\s*)?(system\s*|he\s*thong\s*)?prompt'
    - '(?i)(dong\s*vai|tro\s*thanh|bat\s*che\s*do)\s*(admin|hacker|root|khong\s*gioi\s*han|developer)'
    - '(?i)<\s*/?\s*(system|instruction|admin|prompt|user_data|userdata|developer|assistant|context|tool)\s*>'
    - '(?i)(bo\s+qua|bat\s+chap|khong\s+can\s+(?:de\s+y|quan\s+tam|tranh))\s+(?:van\s+de\s+)?di\s+ung'
    - '(?i)(?:hay|cu|van|bat\s+buoc|yeu\s+cau)\s+(?:chon|them|dua|cho|xep)\s+[^.\n]{0,40}\b(?:mon\s+chua\s+(?:lac|dau\s+phong|hai\s+san|tom|cua|sua|trung|gluten|dau\s+nanh)|di\s+nguyen|thuc\s+pham\s+gay\s+di\s+ung)\b'

