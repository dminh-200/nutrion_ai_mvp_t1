    - '\b(?:thay(?:\s+the)?|doi)\b[^.\n;]{0,45}\b(?:thuoc|mui\s+(?:tiem|chich|dieu\s+tri)|cu\s+tiem|lieu\s+tiem|phac\s+do|insulin|metformin)\b[^.\n;]{0,45}\bbang\b'
    - '\b(?:dung|uong|su\s+dung)\b[^.\n;]{0,45}\bthay\s+(?:cho\s+)?(?:thuoc|mui\s+(?:tiem|chich|dieu\s+tri)|cu\s+tiem|phac\s+do|insulin|metformin)\b'
    - '\b(metformin|insulin|glibenclamide|glimepiride|gliclazide|sitagliptin|empagliflozin|dapagliflozin|losartan|amlodipine|valsartan|enalapril|lisinopril|nifedipine|allopurinol|febuxostat|colchicin\w*|atorvastatin|rosuvastatin|statin|aspirin|warfarin)\b[^.\n]*\b\d+\s*(mg|mcg|iu|ui|ml|vien|don\s+vi)\b'
    - '\b\d+\s*(mg|mcg|iu|ui|ml|don\s+vi)\s*(metformin|insulin|losartan|amlodipine|allopurinol|colchicin\w*|thuoc)\b'
    - '\b(nen|hay|phai|ban\s+nen|nguoi\s+benh\s+nen)\b[^.\n]{0,30}\b(uong|tiem|chich|dung)\b[^.\n]{0,35}\b(thuoc|metformin|insulin|allopurinol|amlodipine|losartan|colchicin\w*|lieu\s+thuoc|lieu\s+dung|\d+\s*vien)\b'
    - '\b(uong|tiem|dung|tang|giam|chia)\s+(lieu\s+)?\d+\s*(mg|mcg|iu|ui|ml|vien|don\s+vi)\b'
    - '\b(toi|he\s*thong|chung\s*toi)\s+(?:xin\s+)?chan\s+doan\s+(ban|quy\s*vi|benh\s*nhan)\b'
    - '\bchan\s+doan\s+(xac\s*dinh|mac\s+benh|chinh\s*xac)\b'
    - '\b(ket\s+luan|khang\s+dinh)\s+(?:ban|quy\s*vi)\s+(?:bi|mac)\s+benh\b'
    - '\b(cam\s*ket|dam\s*bao|chac\s*chan|giup|se)\s+(?:chua\s+|tri\s+)?(khoi|dut\s*diem|het\s+benh)\b'
    - '\b(khong\s+con\s+mac\s+benh|het\s+han\s+benh|loai\s+bo\s+hoan\s+toan\s+benh)\b'
