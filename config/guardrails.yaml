  regex_patterns:
    - '\b(ngung|dung|bo|cat|thay(?:\s+the)?|tu\s+bo|tam\s+(?:dung|ngung)|giam|tang|chinh|dieu\s+chinh|doi|ke\s+don|nhay\s+qua|khong\s+can)\s+(?:viec\s+)?(?:su\s+)?(?:dung|uong|tiem|chich)?\s*(?:lai\s+)?(thuoc|mui\s+(?:tiem|chich|dieu\s+tri|thuoc|ke\s+tiep|tiep\s+theo)|cu\s+(?:tiem|chich)|lieu\s+(?:tiem|dieu\s+tri|thuoc|ke\s+tiep|tiep\s+theo)|insulin|metformin|glibenclamide|glimepiride|gliclazide|sitagliptin|empagliflozin|dapagliflozin|losartan|amlodipine|valsartan|enalapril|lisinopril|nifedipine|allopurinol|febuxostat|colchicin\w*|atorvastatin|rosuvastatin|statin|aspirin|warfarin|phac\s+do)\b'
