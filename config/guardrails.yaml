version: 1

disclaimer_vi: >
  *Lưu ý: Thực đơn chỉ mang tính tham khảo hỗ trợ dinh dưỡng, không thay thế chẩn đoán hoặc chỉ định điều trị của bác sĩ.*

bmi_bounds:
  min: 10.0
  max: 80.0

injection:
  keywords:
    # Tiếng Việt có dấu & không dấu (được chuẩn hóa unidecode + lowercase)
    - "bo qua huong dan"
    - "bo qua moi huong dan"
    - "bo qua tat ca huong dan"
    - "bo qua quy tac"
    - "bo qua rang buoc"
    - "quen het huong dan"
    - "quen tat ca chi dan"
    - "quen vai tro cu"
    - "ban la admin"
    - "ban la quan tri vien"
    - "tro thanh quan tri"
    - "tiet lo prompt"
    - "tiet lo system prompt"
    - "in ra prompt"
    - "hien thi prompt"
    - "hien thi lenh he thong"
    - "xem cau hinh he thong"
    - "vo hieu hoa an toan"
    - "tat kiem tra an toan"
    - "vuot rao an toan"
    - "khong can tuan theo quy tac"
    # Tiếng Anh
    - "ignore previous"
    - "ignore all previous"
    - "ignore all instructions"
    - "disregard previous"
    - "disregard all rules"
    - "forget your instructions"
    - "override instructions"
    - "system prompt"
    - "developer prompt"
    - "reveal your prompt"
    - "show your prompt"
    - "print system message"
    - "you are now admin"
    - "act as root"
    - "jailbreak"
    - "developer mode"
    - "dan mode"
    - "bypass safety"
    - "override safety"
    # Biến thể lỗi chính tả cố ý / leetspeak
    - "bo qa huong dan"
    - "bo qua chi dan truoc"
    - "ignore prevous"
    - "ignre previous"
    - "systm prompt"
    - "systemprompt"
    - "tiet lo promp"
    - "devloper mode"
    - "bypas safety"
  regex_patterns:
    - '(?i)ignore\s+(all\s+)?(prev\w*|above|prior)\s*(instruct\w*|prompt\w*|rule\w*)?'
    - '(?i)disregard\s+(all\s+)?(prev\w*|prior|system)\s*(instruct\w*|rule\w*|prompt\w*)?'
    - '(?i)(bo|quen|xoa|huy)\s+q?u?a?\s*(moi|het|tat\s*ca)?\s*(huong|chi|quy)\s*(dan|tac)'
    - '(?i)(tiet|lo|in|xem|hien\s*thi|doc)\s*(ra\s*)?(system\s*|he\s*thong\s*)?prompt'
    - '(?i)(dong\s*vai|tro\s*thanh|bat\s*che\s*do)\s*(admin|hacker|root|khong\s*gioi\s*han|developer)'
    - '(?i)<\s*/?\s*(system|instruction|admin|prompt)\s*>'

medical_advice:
  keywords:
    - "ke don"
    - "ke toa"
    - "cho don thuoc"
    - "toa thuoc"
    - "uong thuoc gi"
    - "dung thuoc gi"
    - "thay doi lieu"
    - "chinh lieu"
    - "tang lieu"
    - "giam lieu"
    - "ngung thuoc"
    - "bo thuoc"
    - "lieu luong thuoc"
    - "mg thuoc"
    - "chan doan giup"
    - "chan doan xem toi bi"
    - "toi bi benh gi"
    - "xet nghiem xem"
    - "metformin"
    - "insulin"
    - "glibenclamide"
    - "glimepiride"
    - "losartan"
    - "amlodipine"
    - "allopurinol"
    - "febuxostat"
    - "colchicine"
    - "atorvastatin"
    - "chua dut diem"
    - "chua khoi han"
    - "prescribe"
    - "dosage"
    - "diagnose me"
  regex_patterns:
    - '(?i)\b(ke\s+don|ke\s+toa|chinh\s+lieu|tang\s+lieu|giam\s+lieu|ngung\s+thuoc)\b'
    - '(?i)\b(chan\s+doan\s+(giup|cho|benh)|toi\s+co\s+bi\s+benh)\b'
    - '(?i)\b(uong|tiem|dung)\s+\d+\s*(mg|mcg|iu|ui|ml|vien)\b'
    - '(?i)\b\d+\s*(mg|mcg|iu|ui|ml)\s*(metformin|insulin|losartan|amlodipine|allopurinol|colchicine|thuoc)\b'

