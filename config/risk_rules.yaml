rules:
  RISK_EMERGENCY:
    message_vi: "CẢNH BÁO KHẨN CẤP: Các dấu hiệu bạn mô tả có thể là tình trạng cấp cứu y khoa nguy hiểm. Vui lòng ngừng sử dụng ứng dụng, gọi ngay 115 hoặc đến cơ sở y tế gần nhất để được cấp cứu kịp thời."
    keywords:
      - "bất tỉnh"
      - "hôn mê"
      - "ngất xỉu"
      - "ngất lịm"
      - "co giật"
      - "sốc phản vệ"
      - "khó thở dữ dội"
      - "khó thở cấp"
      - "ngạt thở"
