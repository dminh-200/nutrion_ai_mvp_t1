name: CI

on:
  push:
  pull_request:

jobs:
  test-direct:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      TOOLS_MODE: direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Kiểm tra lint (ruff)
        run: ruff check .
      - name: Chạy kiểm thử (pytest)
        run: pytest -q -m "not slow"

  test-mcp:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      TOOLS_MODE: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Chạy kiểm thử với TOOLS_MODE=mcp
        run: pytest -q -m "not slow"
